<!-- Widget: History of AI timeline (Module 1, What Is AI?). Built 2026-10-06 to replace the third-party H5P timeline.
  To change a milestone, edit the data list (window.AIL_TL_DATA) at the top of the script: year, date, title, text, why, track, source, image, reed.
  Tracks: tech, idea, culture, society, suny. Every milestone also appears in the plain list under "All milestones as a list",
  which is the text version for screen readers and print. Images: Wikimedia Commons files, credited on each card.
  The big year, the buttons and the circuit-board background change by era (ERAS and BOARDS in the script). -->
<div class="rh-ail" data-mod="1" data-w="m1-tl">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English&amp;family=Limelight&amp;family=Special+Elite&amp;family=Michroma&amp;family=VT323&amp;family=Orbitron:wght@700&amp;family=Space+Grotesk:wght@600&amp;family=JetBrains+Mono:wght@700&amp;display=swap">
<section class="ail-tl" id="ail-tl" data-src="https://chilburger.github.io/reed-ai-timeline/dist/timeline-data.json" aria-roledescription="timeline" aria-label="History of AI timeline" data-era="now">
  <canvas class="ail-tl-sky ail-tl-sky--a" aria-hidden="true"></canvas><canvas class="ail-tl-sky ail-tl-sky--b" aria-hidden="true"></canvas>
  <div class="ail-tl-year" aria-hidden="true"><span class="ail-tl-year-out"></span><span class="ail-tl-year-fill"></span><span class="ail-tl-era"></span><a class="ail-tl-bgcredit" href="#"></a></div>
  <div class="ail-tl-head">
    <p class="ail-tl-kicker">History of AI</p>
    <p class="ail-tl-count" aria-hidden="true"></p>
    <p class="ail-tl-sr" aria-live="polite"></p>
  </div>
  <div class="ail-tl-filter" role="group" aria-label="Show topics (select one or more)"></div>
  <div class="ail-tl-stage">
    <svg class="ail-tl-thread" aria-hidden="true" focusable="false"><path class="ail-tl-trace" d=""/><path class="ail-tl-lit" d=""/><path class="ail-tl-pulse" d=""/></svg>
    <div class="ail-tl-cards"></div>
  </div>
  <div class="ail-tl-controls">
    <button type="button" class="ail-tl-back">Back</button>
    <button type="button" class="ail-tl-pull"><span class="ail-tl-bead" aria-hidden="true"></span><span class="ail-tl-pull-t">Follow the circuit</span></button>
    <p class="ail-tl-gap" aria-hidden="true"><span class="ail-tl-gap-l">Time to the next milestone</span><span class="ail-tl-gap-v"></span><span class="ail-tl-gap-bar"><i></i></span></p>
  </div>
</section>
<p class="ail-tl-suggest" hidden>Know something that belongs on this timeline? <a href="#">Suggest a milestone</a>: a book, film, song, game, artwork, person or event.</p>
<dialog class="ail-tl-dlg" aria-labelledby="ail-tl-dlg-h"><div class="ail-tl-dlg-in"><button type="button" class="ail-tl-dlg-x" aria-label="Close">&times;</button><p class="ail-tl-dlg-k"></p><h2 id="ail-tl-dlg-h"></h2><div class="ail-tl-dlg-b"></div></div></dialog>
<details class="ail-tl-list">
<summary>All milestones as a list</summary>
<ol></ol>
</details>


<link rel="stylesheet" href="https://chilburger.github.io/reed-ai-timeline/dist/ail-timeline.css">
<script src="https://chilburger.github.io/reed-ai-timeline/dist/ail-timeline.js" defer></script>
</div>
